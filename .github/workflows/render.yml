name: Blender render
on:
  push:
    branches: [main]
    paths: ["ci/render-request.txt"]
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.p.outputs.chunks }}
      short: ${{ steps.p.outputs.short }}
      pct: ${{ steps.p.outputs.pct }}
      spp: ${{ steps.p.outputs.spp }}
      name: ${{ steps.p.outputs.name }}
      first: ${{ steps.p.outputs.first }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ci
      - id: p
        run: python3 ci/plan.py | tee -a "$GITHUB_OUTPUT"
  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        chunk: ${{ fromJson(needs.plan.outputs.chunks) }}
    env:
      SHORT: ${{ needs.plan.outputs.short }}
      PCT: ${{ needs.plan.outputs.pct }}
      SPP: ${{ needs.plan.outputs.spp }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: bl
        with:
          path: blender
          key: blender-5.3.0-linux-x64
      - name: Download Blender 5.3
        if: steps.bl.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o blender.tar.xz https://download.blender.org/release/Blender5.3/blender-5.3.0-linux-x64.tar.xz
          mkdir blender && tar -xf blender.tar.xz -C blender --strip-components=1 && rm blender.tar.xz
      - name: System libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libxkbcommon0 libsm6 libice6
      - name: Render frames ${{ matrix.chunk }}
        run: |
          start=$(date +%s)
          FRAMES="${{ matrix.chunk }}" OUT="$GITHUB_WORKSPACE/out" ./blender/blender -b --factory-startup --python ci/render_ci.py > render.log 2>&1 || { tail -60 render.log; exit 1; }
          grep -E "Saved:" render.log | tail -5
          secs=$(( $(date +%s) - start )); n=$(ls out/*.png | wc -l)
          echo "TIMING frames=${{ matrix.chunk }} count=$n seconds=$secs cores=$(nproc) pct=$PCT spp=$SPP"
          echo "Frames ${{ matrix.chunk }}: $n frames in ${secs}s" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: frames-${{ matrix.chunk }}
          path: out/*.png
          retention-days: 2
  assemble:
    needs: [plan, render]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: frames-*
          merge-multiple: true
          path: frames
      - name: Join frames into a video and publish it
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ needs.plan.outputs.name }}
          FIRST: ${{ needs.plan.outputs.first }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          mkdir pub
          ffmpeg -y -loglevel error -framerate 24 -start_number "$FIRST" -i frames/f_%04d.png -c:v libx264 -crf 17 -pix_fmt yuv420p -vf "pad=ceil(iw/2)*2:ceil(ih/2)*2" -movflags +faststart "pub/$NAME.mp4"
          cp "frames/$(ls frames | head -1)" "pub/$NAME-first-frame.png"
          cd pub
          git init -q && git checkout -q --orphan render-output
          git add . && git -c user.name="github-actions" -c user.email="actions@users.noreply.github.com" commit -q -m "Render output: $NAME (run ${GITHUB_RUN_ID})"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" render-output
